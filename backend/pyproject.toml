[project]
name = "shadowself-backend"
version = "0.1.0"
description = "ShadowSelf OSINT Dashboard Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn>=0.27,<1.0",
    "aiohttp>=3.11.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.10.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["osint"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
